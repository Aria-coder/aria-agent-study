spring:
  application:
    name: agent-study
  main:
    web-application-type: servlet   # ?? servlet, ??????? SseEmitter
  mvc:
    async:
      request-timeout: 600000       # ????(SseEmitter?)??(ms)
  # ========== Spring AI ??(Day3 Function Calling ?) ==========
  # OpenAI starter ????? ChatClient/ChatModel, ????? OpenAI ????
  ai:
    openai:
      base-url: https://api.deepseek.com  # DeepSeek ???
      api-key: ${DEEPSEEK_API_KEY}
      chat:
        options:
          # ????
          model: deepseek-chat
          # ???0~2????????????? 0.7
          temperature: 0.7

server:
  port: 8123
  servlet:
    context-path: /api
  # Tomcat ????: ?????/??????, ????????
  tomcat:
    connection-timeout: 600000          # ??????(ms), ?? 20s ??
    keep-alive-timeout: 600000          # keep-alive ????(ms)

logging:
  level:
    com.zero.ai.agentstudy: INFO

# ??????
springdoc:
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: default
      paths-to-match: /**
      packages-to-scan: com.aria.agentstudy.day01foundation.controller

knife4j:
  enable: true
  production: false
